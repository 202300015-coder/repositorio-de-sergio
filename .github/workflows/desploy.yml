name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Configurar Bun
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # Instalar dependencias
      - run: bun install

      # Compilar proyecto
      - run: bun run build

      # Subir artefacto de dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
