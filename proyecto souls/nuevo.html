<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Landing modificada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Navegación -->
  <nav class="bg-purple-900 p-4 shadow-md">
    <ul class="flex justify-center space-x-6">
      <li><a href="#" class="text-white font-bold border-2 border-purple-500 px-3 py-1 rounded hover:bg-purple-600 hover:rotate-2 transition">Inicio</a></li>
      <li><a href="#" class="text-white font-bold border-2 border-purple-500 px-3 py-1 rounded hover:bg-purple-600 hover:rotate-2 transition">Galería</a></li>
      <li><a href="#" class="text-white font-bold border-2 border-purple-500 px-3 py-1 rounded hover:bg-purple-600 hover:rotate-2 transition">Contacto</a></li>
    </ul>
  </nav>

  <!-- Hero -->
  <section class="h-[60vh] bg-cover bg-center flex flex-col items-center justify-center text-center text-white px-4"
    style="background-image: url('https://picsum.photos/id/1015/1200/600');">
    <h1 id="titulo" class="text-4xl md:text-6xl font-extrabold drop-shadow-lg animate-pulse">
      ✦ Bienvenido a nuestra Landing ✦
    </h1>
    <p class="mt-4 text-lg md:text-xl max-w-2xl bg-black/50 p-3 rounded">
      Una página moderna con Tailwind y efectos.
    </p>
    <button onclick="cambiarTexto()" class="mt-6 px-6 py-3 bg-purple-600 hover:bg-purple-800 rounded-lg transition duration-500 hover:scale-110">
      Cambiar texto
    </button>
  </section>

  <!-- Contenedor con 4 cajas -->
  <div class="flex flex-col md:flex-row justify-center items-center gap-6 mt-12 px-6">
    <div class="bg-indigo-500 p-6 text-white rounded-xl shadow-lg hover:scale-110 transition">Caja 1</div>
    <div class="bg-pink-400 p-6 text-white rounded-xl shadow-lg hover:scale-110 transition">Caja 2</div>
    <div class="bg-blue-600 p-6 text-white rounded-xl shadow-lg hover:scale-110 transition">Caja 3</div>
    <div class="bg-teal-400 p-6 text-white rounded-xl shadow-lg hover:scale-110 transition">Caja 4</div>
  </div>

</body>
</html>
