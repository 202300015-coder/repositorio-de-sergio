<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi primera página</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
</head>
<body class="md:bg-gray-900 text-white text-center p-6">

  <!-- Navegación -->
  <nav>
    <ul class="flex justify-center space-x-6">
      <li><a href="#" class="text-red-500 font-bold border-2 border-red-500 px-3 py-1 hover:bg-red-500 hover:text-white transition">Inicio</a></li>
      <li><a href="#" class="text-red-500 font-bold border-2 border-red-500 px-3 py-1 hover:bg-red-500 hover:text-white transition">Galería</a></li>
      <li><a href="#" class="text-red-500 font-bold border-2 border-red-500 px-3 py-1 hover:bg-red-500 hover:text-white transition">Contacto</a></li>
    </ul>
  </nav>

  <!-- Encabezado decorado nodejs, bun -->
  <h1 id="titulo" class="text-red-500 font-mono text-3xl border-b-2 border-red-500 inline-block pb-2 my-6">
    ☾ Bienvenido a la pesadilla de kosm ☾
  </h1>

  <p id="parrafo" class="border-2 border-gray-600 p-4 m-4 w-3/5 mx-auto bg-gray-800 transition-all">
    Esta es mi primera página con estilos, enlaces y un poco de JavaScript.
  </p>

  <img src="imagen de huerfano de koss.webp" alt="Orphan of Kos" class="mx-auto my-6 max-w-sm border-4 border-red-600">

<button onclick="cambiarTexto()" class="transition duration-500 ease-in-out hover:scale-125 px-4 py-2 bg-red-600 hover:bg-red-800 rounded">
  Cambiar texto
</button>
  <!-- Contenedor con 4 cajas -->
  <div class="flex-col-items-end gap-4 mt-8">
    <div class="bg-red-500 p-6 text-white rounded-lg shadow-lg">Caja 1</div>
    <div class="bg-green-400 p-4 text-black rounded-lg shadow-lg">Caja 2</div>
    <div class="bg-blue-500 p-8 text-white rounded-lg shadow-lg">Caja 3</div>
    <div class="bg-yellow-400 p-2 text-black rounded-lg shadow-lg">Caja 4</div>
  </div>

  <!-- BONUS: si cambias "flex" por "flex-col", se apilan en vertical -->
</body>
</html>
